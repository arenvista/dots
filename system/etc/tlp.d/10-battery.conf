# TLP drop-in for the T480: battery-side settings beyond TLP's defaults.
# Installed to /etc/tlp.d/ by the system.power feature; charge thresholds stay
# in /etc/tlp.conf. Rationale and measurements: docs/section/power.typ.

# No turbo on battery: the CPU holds at or below its 1.7 GHz base clock.
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_BAT=0

# PCIe link power saving (L0s/L1); TLP's default leaves the BIOS's choice.
# Not powersupersave: that adds the L1.1/L1.2 substates, and the NVMe (a
# KingFast on a DRAM-less Silicon Motion SM2263) is from a controller family
# with a history of I/O stalls in them.
PCIE_ASPM_ON_BAT=powersave

# Radios with nothing connected are switched off when the charger is pulled.
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth wwan"

# A further cap on the CPU's top P-state, if turbo-off isn't enough.
#CPU_MAX_PERF_ON_BAT=70
