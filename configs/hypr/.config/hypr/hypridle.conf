# hypridle: idle and lock handling, started from hyprland.lua's start hook.
# Based on /usr/share/hypr/hypridle.conf, with this ThinkPad's keyboard
# backlight device and no auto-suspend. quickshell's keep-awake toggle (an idle
# inhibitor) pauses all of these timers.

general {
    lock_cmd = pidof hyprlock || hyprlock                             # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                          # lock before suspend (e.g. lid close)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen on after resume, without a key press
}

# 2.5 min: dim the panel
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 2.5 min: keyboard backlight off
listener {
    timeout = 150
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume = brightnessctl -rd tpacpi::kbd_backlight
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screens off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
